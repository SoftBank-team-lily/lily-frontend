<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lily — 레포 하나로 피는 배포</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --ink:#F2F0EC; --mute:#8C8B88; --line:rgba(242,240,236,.18);
  --pink:#E0567E; --amber:#E9A53A; --danger:#D6453D; --field:rgba(242,240,236,.06);
  --font:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
/* 이 페이지는 입자 연출을 위해 의도적으로 항상 어두운 화면을 씁니다 */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; --ink:#F2F0EC; } }
:root[data-theme="dark"]{ --bg:#000000; --ink:#F2F0EC; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:400; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
#gl{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }

nav{ position:fixed; top:0; left:0; right:0; z-index:10; padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0)); }
nav .in{ max-width:1080px; margin:0 auto; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; }
nav .brand{ font-weight:600; font-size:1.25rem; letter-spacing:-.01em; }

main{ position:relative; z-index:1; }
.sec{ min-height:115vh; max-width:1080px; margin:0 auto; padding:0 24px; display:flex; }
.sec .copy{ max-width:30rem; word-break:keep-all; text-shadow:0 0 28px #000, 0 0 10px #000, 0 0 2px #000; }
.sec h1,.sec h2{ font-weight:600; letter-spacing:-.025em; line-height:1.15; margin:0 0 .8rem; }
.sec h1{ font-size:clamp(2.3rem,5.2vw,4.1rem); }
.sec h2{ font-size:clamp(1.8rem,4vw,2.75rem); }
.sec p{ color:var(--mute); font-size:1.0625rem; line-height:1.7; margin:0; }
.sec p b{ color:var(--ink); font-weight:600; }

#deploy > *{ opacity:0; transform:translateY(12px); transition:opacity 1s ease, transform 1s ease; }
#deploy.on > *{ opacity:1; transform:none; }
#deploy > .err{ transform:none; }
/* 문구는 화면 중간에서 시작해 아래로 늘어남: 배포 상태가 생겨도 위쪽 꽃 자리를 침범하지 않음 */
#deploy{ min-height:100vh; flex-direction:column; justify-content:flex-start; align-items:center; padding-top:52vh; padding-bottom:6vh; text-align:center; }
#deploy .copy{ max-width:32rem; }

form{ margin-top:1.75rem; display:flex; gap:8px; width:min(32rem,100%); }
input[type=text]{ flex:1; min-width:0; font:inherit; font-size:1rem; color:var(--ink); background:var(--field);
  border:1px solid var(--line); border-radius:12px; padding:14px 16px; outline:none; }
input[type=text]::placeholder{ color:var(--mute); }
input[type=text]:focus-visible{ border-color:var(--ink); }
button{ font:inherit; font-weight:600; font-size:.95rem; border:0; border-radius:12px; padding:0 20px; cursor:pointer;
  background:var(--ink); color:#000; }
button:disabled{ opacity:.4; cursor:default; }
button:focus-visible, label:focus-within{ outline:2px solid var(--pink); outline-offset:3px; }
.opt{ margin-top:14px; font-size:.875rem; color:var(--mute); display:inline-flex; gap:8px; align-items:center; cursor:pointer; }
.opt input{ accent-color:var(--danger); }
.err{ min-height:1.4em; margin-top:10px; font-size:.875rem; color:var(--danger); }

#status{ width:min(32rem,100%); margin-top:1.5rem; text-align:left; display:none; }
#status.show{ display:block; }
#status ol{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
#status li{ height:3px; border-radius:2px; background:var(--line); overflow:hidden; position:relative; }
#status li i{ position:absolute; inset:0; width:0; background:var(--ink); transition:width .3s linear; }
#status li.fail i{ background:#8C7560; }
#status .now{ margin-top:12px; font-size:.95rem; display:flex; justify-content:space-between; gap:12px; }
#status .now span:last-child{ color:var(--mute); white-space:nowrap; }
#status .done{ margin-top:14px; font-size:.95rem; color:var(--mute); line-height:1.6; }
#status .done a{ color:var(--ink); }
#again{ margin-top:14px; height:40px; background:transparent; color:var(--ink); border:1px solid var(--line); display:none; }

@media (max-width:640px){
  form{ flex-direction:column; } button{ height:48px; }
}
@media (prefers-reduced-motion: reduce){ #deploy > *{ transition:none; } #status li i{ transition:none; } }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<nav><div class="in"><span class="brand">Lily</span></div></nav>
<main>
  <section class="sec" id="deploy"><div class="copy">
    <h2>지금 피워 보세요.</h2>
    <p>배포가 진행될수록 꽃에 색이 번져요. 이 화면은 시연용이라 실제 배포는 일어나지 않아요.</p>
  </div>
    <form id="f" novalidate>
      <label for="repo" style="position:absolute;left:-9999px">GitHub 레포 주소</label>
      <input id="repo" type="text" placeholder="github.com/owner/repo" autocomplete="off" spellcheck="false">
      <button id="go" type="submit">배포 시작</button>
    </form>
    <label class="opt"><input type="checkbox" id="failsim"> 롤백 상황으로 시연하기</label>
    <div class="err" id="err" role="alert"></div>
    <div id="status" aria-live="polite">
      <ol id="bars"></ol>
      <div class="now"><span id="stage">레포 확인 중</span><span id="step">1 / 6</span></div>
      <div class="done" id="done"></div>
      <button id="again" type="button">다시 배포하기</button>
    </div>
  </section>
</main>

<script>
// 폼은 꽃 로딩과 무관하게 페이지 진입 약 1.4초 뒤에 나타남(너무 이르면 연출이 묻히고, 늦으면 기다리게 됨)
(() => {
  const show = () => document.getElementById('deploy').classList.add('on');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return show();
  setTimeout(show, Math.max(0, 1400 - performance.now()));
})();
</script>

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false, powerPreference:'high-performance' });
const PR = Math.min(devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
const flower = new THREE.Group(); scene.add(flower);

const uniforms = {
  uTime:{value:0}, uAssemble:{value:reduce?1:0}, uProgress:{value:0}, uWilt:{value:0},
  uSize:{value:22}, uPR:{value:PR}, uOpacity:{value:1}, uGather:{value:0}
};

const vert = `
attribute vec3 aStart; attribute vec3 aSpread; attribute float aExtra; attribute float aRand; attribute float aBright; attribute vec3 aColor;
uniform float uTime, uAssemble, uProgress, uWilt, uSize, uPR, uGather;
varying vec3 vColor; varying float vAlpha;
void main(){
  float t = clamp((uAssemble - aRand*0.4)/0.6, 0.0, 1.0);
  t = 1.0 - pow(1.0 - t, 3.0);
  // 배포 진행률에 따라 퍼진 자리(aSpread)에서 제자리(position)로 모임. 끝부분에서 가장 많이 모이도록 곡선을 줌
  float g = clamp((pow(uGather, 1.4) * 1.3) - aRand * 0.3, 0.0, 1.0);
  g = g * g * (3.0 - 2.0 * g);
  vec3 home = mix(aSpread, position, g);
  // 시듦: 바깥쪽일수록 아래로 처지고 안쪽으로 오그라듦
  float dw = length(position.xy) / 1.75;
  float w = uWilt * (0.85 + 0.3*aRand);
  home.xy *= 1.0 - w * 0.16 * dw;
  home.y  -= w * (0.9 * dw * dw + 0.06);
  home.z  -= w * 0.4 * dw;
  vec3 p = mix(aStart, home, t);
  // 일부 입자는 꽃잎 가루처럼 천천히 떨어짐
  float fall = step(0.84, aRand) * uWilt;
  float ft = fract(uTime * 0.07 + aRand * 7.0);
  p.y -= fall * ft * ft * 2.4;
  p.x += fall * sin(uTime * 0.8 + aRand * 50.0) * 0.1 * ft;
  float calm = 1.0 - 0.75 * g;
  p.x += sin(uTime*0.6 + aRand*40.0)*0.022*calm;
  p.y += cos(uTime*0.5 + aRand*33.0)*0.022*calm;
  p.z += sin(uTime*0.4 + aRand*21.0)*0.035*calm;
  vec4 mv = modelViewMatrix * vec4(p,1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = uSize * uPR * (0.55 + aBright*0.7) * (1.0 + 0.12*g) / -mv.z;
  float d = length(position.xy) / 1.75;
  float edge = uProgress * 1.3;
  float reveal = 1.0 - smoothstep(edge - 0.22, edge, d + (aRand - 0.5)*0.18);
  vec3 gray = vec3(0.95,0.94,0.92) * (0.3 + aBright*0.8);
  vec3 col  = aColor * (0.4 + aBright*0.85);
  vec3 c = mix(gray, col, reveal);
  vec3 dry = vec3(0.56, 0.47, 0.37) * (0.22 + aBright*0.55);
  c = mix(c, dry, uWilt * 0.85);
  vColor = c;
  float tw = 0.62 + 0.38*sin(uTime*(1.2 + aRand*3.0) + aRand*60.0);
  vAlpha = (0.1 + aBright*0.55) * tw * mix(0.3, 1.0, t) * mix(0.75, 1.1, g) * mix(1.0, g*g, aExtra) * (1.0 - 0.4*uWilt) * (1.0 - fall*ft);
}`;
const frag = `
uniform float uOpacity; varying vec3 vColor; varying float vAlpha;
void main(){
  float r = length(gl_PointCoord - 0.5);
  if (r > 0.5) discard;
  float a = smoothstep(0.5, 0.0, r);
  gl_FragColor = vec4(vColor, a * vAlpha * uOpacity);
}`;

function buildFromImage(img){
  const S = img.width, c = document.createElement('canvas'); c.width = S; c.height = S;
  const ctx = c.getContext('2d'); ctx.drawImage(img,0,0);
  const data = ctx.getImageData(0,0,S,S).data;
  const small = innerWidth < 700;
  const K = small ? 2.4 : 3.8, W = 3.4, CX = 88.2/187*S, CY = 79.6/187*S;
  const pos=[], start=[], spread=[], rnd=[], bri=[], col=[], extra=[];
  const amber=[0.93,0.66,0.24], pink=[0.9,0.33,0.5], blush=[1.0,0.92,0.94], green=[0.72,0.82,0.45];
  const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  const ss=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
  for (let y=0; y<S; y++) for (let x=0; x<S; x++){
    const b = data[(y*S+x)*4] / 255;
    if (b < 0.1) continue;
    const n = Math.floor(b*K + Math.random());
    for (let k=0; k<n; k++){
      const px = ((x + Math.random() - CX) / S) * W;
      const py = -((y + Math.random() - CY) / S) * W;
      const d = Math.hypot(px,py) / 1.75;
      const pz = -0.45*(1-ss(0,0.8,d)) + (b-0.5)*0.3 + (Math.random()-0.5)*0.08;
      pos.push(px,py,pz);
      const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), R = 5 + Math.random()*6;
      start.push(R*Math.sin(ph)*Math.cos(th), R*Math.sin(ph)*Math.sin(th), R*Math.cos(ph) - 3);
      // 처음에 머무는 넓게 퍼진 자리: 꽃 윤곽을 조금 키우고 무작위로 흩뜨림
      const th2 = Math.random()*Math.PI*2, ph2 = Math.acos(2*Math.random()-1), r2 = 0.03 + Math.sqrt(Math.random())*0.17;
      spread.push(px*1.06 + r2*Math.sin(ph2)*Math.cos(th2), py*1.06 + r2*Math.sin(ph2)*Math.sin(th2), pz + r2*Math.cos(ph2)*1.3);
      rnd.push(Math.random()); bri.push(b); extra.push(Math.random() < 0.4 ? 1 : 0);
      let cc;
      if (d < 0.07) cc = mixc(green, amber, ss(0.02,0.07,d));
      else if (d < 0.16) cc = amber;
      else cc = mixc(pink, blush, ss(0.18, 0.72, d));
      if (d > 0.16 && Math.random() < 0.035 && d < 0.5) cc = [0.62,0.12,0.28]; // 스타게이저 백합의 반점
      col.push(...cc);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aStart', new THREE.Float32BufferAttribute(start,3));
  g.setAttribute('aSpread', new THREE.Float32BufferAttribute(spread,3));
  g.setAttribute('aExtra', new THREE.Float32BufferAttribute(extra,1));
  g.setAttribute('aRand', new THREE.Float32BufferAttribute(rnd,1));
  g.setAttribute('aBright', new THREE.Float32BufferAttribute(bri,1));
  g.setAttribute('aColor', new THREE.Float32BufferAttribute(col,3));
  const m = new THREE.ShaderMaterial({ uniforms, vertexShader:vert, fragmentShader:frag,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
  flower.add(new THREE.Points(g, m));

  // 배경의 떠다니는 먼지
  const dust=[], dr=[], dc=[], db=[], ds=[];
  for (let i=0;i<(small?600:1400);i++){
    const p=[(Math.random()-0.5)*14,(Math.random()-0.5)*9,-2-Math.random()*6];
    dust.push(...p); ds.push(...p); dr.push(Math.random()); db.push(0.12+Math.random()*0.25); dc.push(1,1,1);
  }
  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.Float32BufferAttribute(dust,3));
  dg.setAttribute('aStart', new THREE.Float32BufferAttribute(ds,3));
  dg.setAttribute('aSpread', new THREE.Float32BufferAttribute(dust,3));
  dg.setAttribute('aExtra', new THREE.Float32BufferAttribute(new Array(dr.length).fill(0),1));
  dg.setAttribute('aRand', new THREE.Float32BufferAttribute(dr,1));
  dg.setAttribute('aBright', new THREE.Float32BufferAttribute(db,1));
  dg.setAttribute('aColor', new THREE.Float32BufferAttribute(dc,3));
  const du = { ...uniforms, uProgress:{value:0}, uWilt:{value:0}, uAssemble:{value:1} };
  scene.add(new THREE.Points(dg, new THREE.ShaderMaterial({ uniforms:du, vertexShader:vert, fragmentShader:frag,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending })));

  const t0 = performance.now();
  (function intro(){
    if (reduce) { uniforms.uAssemble.value = 1; return; }
    const t = Math.min(1, (performance.now()-t0)/3200);
    uniforms.uAssemble.value = t;
    if (t < 1) requestAnimationFrame(intro);
  })();
}

// 카메라는 한 자리에 고정하되, 내비 아래~문구 위 빈 공간에 꽃 전체가 들어오도록 거리와 높이를 계산
const FLOWER = { cx:0.12, cy:-0.25, hw:1.65, hh:1.70 }; // 이미지에서 잰 꽃의 중심과 반폭·반높이(world 단위)
const FIT_MARGIN = 1.0; // 1보다 크면 꽃 주변 여유가 생기는 대신 꽃이 작아짐
let VIEW;
function fitView(){
  const H = innerHeight, aspect = innerWidth / H;
  const sec = document.getElementById('deploy');
  // 넓은 화면에선 로고가 왼쪽 끝이라 가운데 꽃과 안 부딪히므로 화면 맨 위까지 씀
  const top = innerWidth >= 700 ? 12 : document.querySelector('nav').getBoundingClientRect().bottom - 8;
  const bottom = sec.getBoundingClientRect().top + scrollY + parseFloat(getComputedStyle(sec).paddingTop) - 16;
  const nTop = 1 - 2*top/H, nBot = 1 - 2*bottom/H;
  const c = (nTop + nBot) / 2, e = Math.max(0.1, (nTop - nBot) / 2);
  // 화면 절반 높이를 world 단위로: 세로 공간과 가로 폭 중 더 빡빡한 쪽에 맞춤
  // 가로는 바깥 꽃잎이 카메라 쪽으로 튀어나와 커 보이므로 폭의 86%만 씀
  const half = Math.max(FLOWER.hh*FIT_MARGIN / e, FLOWER.hw*FIT_MARGIN / (0.86*aspect));
  const y = FLOWER.cy - c*half;
  VIEW = { cam:[FLOWER.cx, y, half / Math.tan(THREE.MathUtils.degToRad(camera.fov/2))], look:[FLOWER.cx, y, 0], rot:[0,0] };
}
fitView();
const cur = target();
const mouse = new THREE.Vector2(), mouseS = new THREE.Vector2();
addEventListener('pointermove', e => { mouse.set(e.clientX/innerWidth-0.5, e.clientY/innerHeight-0.5); });

function target(){
  return {
    cam:new THREE.Vector3(...VIEW.cam),
    look:new THREE.Vector3(...VIEW.look),
    rot:new THREE.Vector2(...VIEW.rot)
  };
}

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix();
  uniforms.uSize.value = (h / 900) * 20 + 4;
  fitView();
}
addEventListener('resize', resize); resize();

let last = performance.now(), progTarget = 0, wiltTarget = 0;
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (!reduce) uniforms.uTime.value += dt;
  const T = target(), k = reduce ? 1 : 1 - Math.pow(0.02, dt);
  cur.cam.lerp(T.cam,k); cur.look.lerp(T.look,k); cur.rot.lerp(T.rot,k);
  mouseS.lerp(mouse, reduce?0:1-Math.pow(0.05,dt));
  camera.position.copy(cur.cam); camera.lookAt(cur.look);
  flower.rotation.x = cur.rot.x + mouseS.y*0.18;
  flower.rotation.y = cur.rot.y + mouseS.x*0.28;
  const pk = reduce ? 1 : 1 - Math.pow(0.15, dt);
  uniforms.uProgress.value += (progTarget - uniforms.uProgress.value) * pk;
  const gk = reduce ? 1 : 1 - Math.pow(0.35, dt);
  uniforms.uGather.value += (progTarget - uniforms.uGather.value) * gk;
  const wk = reduce ? 1 : 1 - Math.pow(0.45, dt);
  uniforms.uWilt.value += (wiltTarget - uniforms.uWilt.value) * wk;
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
const img = new Image(); img.onload = () => { buildFromImage(img); requestAnimationFrame(loop); }; img.src = IMG;

// ---- 배포 시연 ----
const STAGES = [
  ['레포 확인 중', 1.2], ['빌드 중', 3.2], ['이미지 올리는 중', 1.6],
  ['트래픽 10%로 새 버전 내보내는 중', 2.2], ['에러율·응답 시간 판정 중', 2.6], ['트래픽 100%로 전환 중', 1.6]
];
const $ = id => document.getElementById(id);
const bars = $('bars');
STAGES.forEach(() => { const li = document.createElement('li'); li.appendChild(document.createElement('i')); bars.appendChild(li); });
let running = false;

function parseRepo(v){
  v = v.trim().replace(/\.git$/,'').replace(/\/+$/,'');
  const m = v.match(/^(?:https?:\/\/)?(?:www\.)?(?:github\.com\/)?([A-Za-z0-9-]{1,39})\/([A-Za-z0-9._-]{1,100})$/);
  return m ? `${m[1]}/${m[2]}` : null;
}

$('f').addEventListener('submit', e => {
  e.preventDefault();
  if (running) return;
  const repo = parseRepo($('repo').value);
  if (!repo){ $('err').textContent = 'owner/repo 형식이나 github.com 주소로 입력해 주세요.'; $('repo').focus(); return; }
  $('err').textContent = '';
  run(repo, $('failsim').checked);
});
$('again').addEventListener('click', () => {
  progTarget = 0; wiltTarget = 0; $('status').classList.remove('show');
  $('again').style.display='none'; $('go').disabled=false; $('repo').disabled=false; $('repo').focus();
});

async function run(repo, fail){
  running = true; $('go').disabled = true; $('repo').disabled = true;
  progTarget = 0; wiltTarget = 0;
  $('status').classList.add('show'); $('done').textContent = ''; $('again').style.display='none';
  [...bars.children].forEach(li => { li.classList.remove('fail'); li.firstChild.style.width='0'; });
  const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms,300) : ms));
  for (let i=0;i<STAGES.length;i++){
    const [name, sec] = STAGES[i];
    $('stage').textContent = name; $('step').textContent = `${i+1} / ${STAGES.length}`;
    const li = bars.children[i], steps = 12;
    for (let s=1;s<=steps;s++){
      await wait(sec*1000/steps);
      li.firstChild.style.width = (s/steps*100)+'%';
      progTarget = (i + s/steps) / STAGES.length;
      if (fail && i===4 && s===7){
        li.classList.add('fail'); wiltTarget = 1;
        $('stage').textContent = '에러율 기준 초과';
        await wait(1400);
        wiltTarget = 0.85;
        $('stage').textContent = '이전 버전으로 되돌렸어요';
        $('done').innerHTML = `새 버전의 에러율이 기준(2%)을 넘어서 트래픽을 이전 버전으로 모두 돌렸어요. 서비스는 계속 정상이에요. 로그에서 원인을 확인한 뒤 다시 배포해 주세요.`;
        finish(); return;
      }
    }
  }
  $('stage').textContent = '배포 완료'; $('step').textContent = `${STAGES.length} / ${STAGES.length}`;
  const name = repo.split('/')[1].toLowerCase().replace(/[^a-z0-9-]/g,'-');
  $('done').innerHTML = `<b style="color:var(--ink)">${repo}</b>가 피었어요. 주소는 <a href="#" onclick="return false">${name}.lily.app</a>이고, 모니터링 화면에서 상태를 계속 볼 수 있어요.`;
  finish();
}
function finish(){ running = false; $('again').style.display='inline-block'; }
})();
</script>
